name: API CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: API lint (Ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Check Python style
        run: python -m ruff check .

  tests:
    name: API tests (PostgreSQL + Redis)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15.10-alpine
        env:
          POSTGRES_USER: wishlist_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: wishlist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wishlist_ci -d wishlist_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://wishlist_ci:ci-only-password@localhost:5432/wishlist_test
      TEST_DATABASE_URL: postgresql://wishlist_ci:ci-only-password@localhost:5432/wishlist_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-key-not-used-outside-tests
      ALGORITHM: HS256
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Verify service connections
        run: |
          python - <<'PY'
          import os
          import psycopg2
          import redis
          with psycopg2.connect(os.environ["TEST_DATABASE_URL"], connect_timeout=5) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT 1")
                  assert cursor.fetchone() == (1,)
          assert redis.Redis.from_url(os.environ["REDIS_URL"]).ping()
          print("PostgreSQL and Redis accept real connections")
          PY
      - name: Run health and PostgreSQL endpoint tests
        run: python -m pytest -v
      - name: Verify PostgreSQL test fails without database
        env:
          TEST_DATABASE_URL: postgresql://wishlist_ci:ci-only-password@127.0.0.1:1/wishlist_test
        run: |
          set +e
          python -m pytest tests/test_postgres.py -q > /tmp/postgres-unavailable.log 2>&1
          result=$?
          set -e
          cat /tmp/postgres-unavailable.log
          test "$result" -eq 1
          grep -q 'OperationalError' /tmp/postgres-unavailable.log
          echo "Verified: the integration test fails when PostgreSQL is unavailable"
