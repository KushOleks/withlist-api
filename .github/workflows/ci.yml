name: API CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  lint:
    name: API lint (Ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Check Python style
        run: python -m ruff check .

  tests:
    name: API tests (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11.9', '3.12.12']
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15.10-alpine
        env:
          POSTGRES_USER: wishlist_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: wishlist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wishlist_ci -d wishlist_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://wishlist_ci:ci-only-password@localhost:5432/wishlist_test
      SECRET_KEY: ci-only-key-not-used-outside-tests
      ALGORITHM: HS256
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Verify PostgreSQL connection
        run: |
          python - <<'PY'
          import os
          import psycopg2
          with psycopg2.connect(os.environ["DATABASE_URL"], connect_timeout=5) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT 1")
                  assert cursor.fetchone() == (1,)
          print("PostgreSQL accepts real connections")
          PY
      - name: Run health and PostgreSQL endpoint tests
        run: python -m pytest -v --cov --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov
      - name: Upload coverage report even after test failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-coverage-python-${{ matrix.python }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify PostgreSQL test fails without database
        env:
          DATABASE_URL: postgresql://wishlist_ci:ci-only-password@127.0.0.1:1/wishlist_test
        run: |
          set +e
          python -m pytest tests/test_postgres.py -q > /tmp/postgres-unavailable.log 2>&1
          result=$?
          set -e
          cat /tmp/postgres-unavailable.log
          test "$result" -eq 1
          grep -q 'OperationalError' /tmp/postgres-unavailable.log
          echo "Verified: the integration test fails when PostgreSQL is unavailable"

  container:
    name: API image (Docker)
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR only for publication
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/kusholeks/wishlist-api
          flavor: latest=false
          tags: |
            type=raw,value=pr-${{ github.event.number }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build image; publish only main and release tags
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: production
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=wishlist-api
          cache-to: type=gha,mode=max,scope=wishlist-api
      - name: Verify PR image user and excluded files
        if: github.event_name == 'pull_request'
        env:
          IMAGE: ghcr.io/kusholeks/wishlist-api:pr-${{ github.event.number }}
        run: |
          test "$(docker run --rm "$IMAGE" id -u)" != 0
          docker run --rm "$IMAGE" whoami
          docker run --rm "$IMAGE" sh -c 'test ! -e .env && test ! -d .git && test ! -d tests && ls -a'

  image_scan:
    name: API image scan (Trivy, advisory)
    needs: container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Load native image from build cache for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: production
          platforms: linux/amd64
          load: true
          push: false
          tags: local/wishlist-api:scan
          cache-from: type=gha,scope=wishlist-api
      - name: Scan image without blocking pull requests
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/wishlist-api:scan
          scan-type: image
          scanners: vuln
          format: json
          output: trivy-report.json
          exit-code: '0'
      - name: Summarize finding sources
        if: always()
        run: |
          python3 - <<'PYREPORT'
          import json
          import os
          from pathlib import Path
          report = Path("trivy-report.json")
          if not report.exists():
              message = "Scan did not produce a report; inspect the scanner logs."
          else:
              results = json.loads(report.read_text()).get("Results", [])
              counts = {category: sum(len(r.get("Vulnerabilities", [])) for r in results if r.get("Class") == category) for category in ("os-pkgs", "lang-pkgs")}
              source = "base OS packages" if counts["os-pkgs"] > counts["lang-pkgs"] else "application dependencies" if counts["lang-pkgs"] > counts["os-pkgs"] else "equal counts in both categories"
              message = f"Most findings: {source}. OS: {counts['os-pkgs']}; application: {counts['lang-pkgs']}."
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(message + "\n")
          print(message)
          PYREPORT
      - name: Preserve image vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wishlist-api-trivy
          path: trivy-report.json
          retention-days: 14
          if-no-files-found: warn
