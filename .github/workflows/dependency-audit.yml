name: API dependency audit

on:
  schedule:
    - cron: '17 3 * * *'
      timezone: Europe/Kyiv
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: API nightly dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check Kyiv night window
        id: night_window
        shell: bash
        run: |
          hour=$(TZ=Europe/Kyiv date +%H)
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]] || (( 10#$hour < 6 )); then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "### Scheduled audit skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub delivered this scheduled run after the 00:00–06:00 Europe/Kyiv window. No dependency audit was performed. Use Run workflow for a manual audit." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.night_window.outputs.allowed == 'true'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.night_window.outputs.allowed == 'true'
        with:
          python-version: '3.11.9'
      - name: Install audit tool
        if: steps.night_window.outputs.allowed == 'true'
        run: python -m pip install pip-audit==2.9.0
      - name: Audit locked application and test dependencies
        if: steps.night_window.outputs.allowed == 'true'
        run: python -m pip_audit --disable-pip --no-deps -r requirements-ci.txt --format json --output pip-audit.json
      - name: Preserve audit report even when vulnerabilities are found
        if: always() && steps.night_window.outputs.allowed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-dependency-audit
          path: pip-audit.json
          if-no-files-found: warn
          retention-days: 14
