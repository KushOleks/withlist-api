# Docker Compose 2.24.4+; use together with compose.yaml and --profile dev.
services:
  api:
    profiles: [dev]
    build:
      target: development
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - requirements.txt
            - Dockerfile
            - Dockerfile.dev
            - compose*.yaml
        - action: rebuild
          path: requirements.txt
  ui:
    profiles: [dev]
    build:
      target: development
    ports: !override
      - "127.0.0.1:${UI_PORT:-8080}:5173"
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    volumes:
      - ../wishlist-ui:/app
      - ui_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 60s
volumes:
  ui_node_modules:
